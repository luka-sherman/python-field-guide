site_name: Python Field Guide
site_url: https://pythonfieldguide.com

nav:
  - Home: index.md
  - Basic Data Types: basic_data_types.md
  - Collections of Data: collections_of_data.md
  - Conditionals: conditionals.md
  - Loops: loops.md
  - OOP: oop.md
  - Pillow: pillow.md
  - Tkinter: tkinter.md

not_in_nav: |
  privacy.md

theme:
  name: material
  favicon: img/favicon.png
  language: en
  logo: img/favicon-large.png
  font:
    text: Inter
    code: IBM Plex Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.footer
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - toc.integrate
    - content.code.copy
    - search.suggest

markdown_extensions:
  - md_in_html
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: false

copyright: "&copy; 2026 Luka Sherman"

extra:
  generator: false
  analytics:
    provider: google
    property: G-E5B3P6NCP0
  consent:
    title: Cookie consent
    description: >-
      This site uses analytics to understand how the site is being used,
      helping improve the content over time. See our
      <a href="/privacy/">privacy policy</a> for more information.
    actions:
      - accept
      - reject
  social:
    - icon: fontawesome/brands/github 
      link: https://github.com/luka-sherman/python-field-guide
        
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js
  - javascripts/pyodide_runner.js
