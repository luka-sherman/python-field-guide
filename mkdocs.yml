site_name: Python Field Guide
site_url: https://pythonfieldguide.com

hooks:
  - hooks/thanks_url.py

nav:
  - Home: index.md
  - Workspace: workspace.md
  - Foundations: foundations.md
  - Types: types.md
  - Collections: collections.md
  - Conditionals: conditionals.md
  - Loops: loops.md
  - Functions: functions.md
  - Classes: oop.md
  - Bugs: bugs.md
  - Libraries:
      - Overview: libraries.md
      - Standard Library:
          - datetime: datetime.md
          - random: random.md
          - csv: csv.md
          - Tkinter: tkinter.md
      - Third-Party:
          - NumPy: numpy.md
          - pandas: pandas.md
          - Pillow: pillow.md
          - requests: requests.md

theme:
  name: material
  favicon: img/favicon.png
  language: en
  logo: img/favicon-large.png
  font:
    text: Inter
    code: IBM Plex Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.footer
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - toc.integrate
    - content.code.copy
    - search.suggest

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: '&copy; <span id="copyright-year">2026</span> Luka'

extra:
  generator: false
  analytics:
    provider: google
    property: G-E5B3P6NCP0
  social:
    - icon: material/information
      link: /about/
      name: About
    - icon: material/shield-lock
      link: /privacy/
      name: Privacy policy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js
  - javascripts/pyodide_runner.js
  - javascripts/copyright_year.js
  - javascripts/external_links.js
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
