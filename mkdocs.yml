site_name: PyTry

nav:
  - Home: index.md
  - Basic Data Types: basic_data_types.md
  - Collections of Data: collections_of_data.md

theme:
  name: material
  font:
    text: Inter
    code: IBM Plex Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - toc.integrate
    - content.code.copy

markdown_extensions:
  - md_in_html
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js
  - javascripts/pyodide_runner.js
