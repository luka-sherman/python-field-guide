site_name: Python Field Guide
site_url: https://pythonfieldguide.com

hooks:
  - hooks/thanks_url.py

nav:
  - Home: index.md
  - Workspace: workspace.md
  - Foundations: foundations.md
  - Types: types.md
  - Collections: collections.md
  - Conditionals: conditionals.md
  - Loops: loops.md
  - Functions: functions.md
  - Classes: oop.md
  - Bugs: bugs.md
  - Libraries:
      - All: libraries/index.md
      - Built-in:
          - datetime: libraries/datetime.md
          - random: libraries/random.md
          - csv: libraries/csv.md
          - Tkinter: libraries/tkinter.md
      - Third-Party:
          - NumPy: libraries/numpy.md
          - OpenCV: libraries/opencv.md
          - pandas: libraries/pandas.md
          - Pillow: libraries/pillow.md
          - requests: libraries/requests.md

theme:
  name: material
  favicon: img/favicon.png
  language: en
  logo: img/favicon-large.png
  font:
    text: Inter
    code: IBM Plex Mono
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.expand
    - navigation.footer
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - toc.integrate
    - content.code.copy
    - content.tooltips
    - search.suggest

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: ["includes"]
      auto_append:
        - glossary.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables

copyright: '&copy; <span id="copyright-year">2026</span> Luka'

extra:
  analytics:
    provider: google
    property: G-E5B3P6NCP0
  generator: false
  social:
    - icon: material/information
      link: /about/
      name: About
    - icon: material/shield-lock
      link: /privacy/
      name: Privacy policy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js
  - javascripts/pyodide_runner.js
  - javascripts/copyright_year.js
  - javascripts/external_links.js
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
