site_name: Python Field Guide
site_url: https://pythonfieldguide.com

nav:
  - Home: index.md
  - Basic Data Types: basic_data_types.md
  - Collections of Data: collections_of_data.md
  - Conditionals: conditionals.md
  - Loops: loops.md
  - OOP: oop.md

theme:
  name: material
  font:
    text: Inter
    code: IBM Plex Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.footer
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - toc.integrate
    - content.code.copy

markdown_extensions:
  - md_in_html
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: false

copyright: Copyright &copy; 2026 Luka Sherman

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github 
      link: https://github.com/luka-sherman
        
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js
  - javascripts/pyodide_runner.js
